[base]
package = metroid_ii
env_name = metroid_ii
policy_name = Policy
# Recurrent
rnn_name = Recurrent


# Try something like:
# num_envs = 32
# num_workers = 4
# env_batch_size = 16

# Do not set batch_size=1. That is the total number of train steps per update.
# Should be at least 1024, probably at least 4096.  num_envs*128 is a good
# baseline and increase from there. Minibatch size default to 1/4 or 1/8 of that


[train]
# I don't have a GPU
# device = cpu
# My oldass GPU can't handle the faster compiled stuff.
compile = False

# total_timesteps = 1_000_000
total_timesteps = 300_000_000

# Horizon = (batch size / (num envs * num workers))

# How many times to train on each minibatch
# Usually no more than 4 or 5
update_epochs = 4

# Was using this on CPU only laptop
# num_envs = 32
num_envs = 16

# How many threads to use, very system dependent
num_workers = 4

# 8192
# 16384
# 32768
# 65536

# how many steps of play per update
batch_size = 16384

# typically 1/4 or 1/8 of batch_size according to J. Saurez
minibatch_size = 4096

# Vectorization param, see what makes it run fastest
# this is the "pop from empty list" of workers error
# Must be divisible by num_envs/num_workers
env_batch_size = 8


# checkpoint every N updates
checkpoint_interval = 200

zero_copy = True
gamma = 0.997
learning_rate = 4.0e-4
anneal_lr = False

