[base]
package = metroid_ii
env_name = metroid_ii
policy_name = Policy
# Recurrent
rnn_name = Recurrent

[train]
device = cpu
# comically large to ensure it trains for quite a while
total_timesteps = 100_000_000

num_envs = 8
num_workers = 4

# ??? breaks if changed
env_batch_size = None

zero_copy = False
update_epochs = 3
gamma = 0.998

# how many steps of play per update (?)
batch_size = 2048
minibatch_size = 128

compile = True
learning_rate = 3.0e-4
anneal_lr = False

# if N will checkpoint every N updates
checkpoint_interval = 100
